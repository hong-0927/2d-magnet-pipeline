[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "2d-magnet-pipeline"
version = "0.1.0"
description = "2D magnetic monolayer: structure -> exchange coupling J -> Monte Carlo critical temperature (T_C/T_N)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "吴思泓" }]
keywords = ["2d-magnets", "magnetism", "Heisenberg", "Monte Carlo", "exchange coupling", "DFT"]
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
# Pillow 是可选兜底渲染器：matplotlib 在 import 期就要 pyparsing/cycler/contourpy/fontTools/kiwisolver,
# 缺任何一个（或离线装不上）时, 超胞图/簇磁体图/三角图/MC 曲线图会自动改走纯 Pillow 的等价路径
# （见 KNOWN_ISSUES.md 的 fig_backend 条）。这里与 requirements.txt 的 Pillow>=9.0 对齐:
# 走 `pip install -r requirements.txt` 会默认装, 走 `pip install .` 想带上就写 `pip install ".[render-fallback]"`。
render-fallback = ["Pillow>=9.0"]

[project.scripts]
2d-magnet = "run_2d_magnet:main"

[tool.setuptools]
# run_2d_magnet.py 作为顶层模块安装; scripts/ 作为普通包一起装 (含 literature_J.json),
# 因此非可编辑 `pip install .` 后 `2d-magnet` 命令也能通过 `import scripts` 定位脚本。
py-modules = ["run_2d_magnet"]
packages = ["scripts"]

[tool.setuptools.package-data]
scripts = ["*.json"]
